model: Qwen/Qwen2.5-7B-Instruct
aws_region: us-east-1

backends:
  selfhost:
    # Override with SELFHOST_URL in .env (e.g. http://192.168.86.176:30080)
    base_url_env: SELFHOST_URL
    default_base_url: http://192.168.86.176:30080
    api_key_env: SELFHOST_API_KEY
    default_api_key: EMPTY
    openai_api_base_suffix: /v1

  ecs:
    stack_name: ecs-inference-mvp
    output_key: ServiceUrl
    api_key_env: INFERENCE_API_KEY
    openai_api_base_suffix: /v1

  bedrock:
    stack_name: bedrock-inference-mvp
    output_key: InferenceFunctionUrl
    api_key_env: INFERENCE_API_KEY
    # Function URL already ends with /; append "v1" (not "/v1")
    openai_api_base_suffix: v1
