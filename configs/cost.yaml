# Unified cost model for Self-host / ECS / Bedrock (USD).
# estimate_cost.py reports BOTH normalized busy capacity cost and
# (for Bedrock CMU) session-billed / allocated cost — see README.
#
# Verify rates for your account/region before publishing paper numbers.

currency: USD

# How to allocate session CMU bill across cells:
#   requests — proportional to num_completed_requests (paper default)
#   duration — proportional to approx_duration_s
session_allocation: requests

selfhost:
  billing: electricity
  # Marginal OpEx while serving (paper: "electricity-only")
  power_watts: 350
  electricity_usd_per_kwh: 0.15
  use_electricity: true
  # TCO proxy: whole-system purchase amortized over lifetime hours
  # (paper: report electricity-only AND amortized side-by-side)
  hardware:
    system_purchase_usd: 2500
    lifetime_hours: 26280   # e.g. 3 years × 24 × 365
  # Primary $/hour used for normalized_compute_cost:
  #   electricity | amortized
  primary_hourly: amortized

ecs:
  billing: hourly
  # COMPUTE-ONLY: 1 × g5.xlarge (1 × A10G) on-demand instance price.
  # Phase 1 does NOT include EBS, ALB, NAT, CloudWatch, or data transfer.
  cost_per_hour: 1.006
  cost_scope: compute_only

bedrock:
  # Custom Model Import (On-Demand): CMU × $/CMU/min in 5-minute windows.
  # Docs: https://docs.aws.amazon.com/bedrock/latest/userguide/import-model-calculate-cost.html
  # NOT per-token.
  billing: cmu
  # Default copy count when CloudWatch ModelCopy is unavailable.
  # Prefer per-row `model_copies` from fetch_bedrock_metrics.py / aggregated.csv.
  model_copies: 1
  custom_model_units_per_copy: 2
  # US East (N. Virginia) CMU rate — confirm on Bedrock pricing page
  usd_per_cmu_per_minute: 0.05718
  billing_window_minutes: 5
  cost_per_hour: 0.0   # no Provisioned Throughput
  #
  # If you instead compare against an on-demand foundation model (true token billing):
  # billing: token
  # input_usd_per_1m_tokens: 0.0
  # output_usd_per_1m_tokens: 0.0
  # cost_per_hour: 0.0
