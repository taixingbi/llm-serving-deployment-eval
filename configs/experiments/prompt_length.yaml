name: prompt_length
description: Experiment 2 — prompt length sweep (capped at 4096 for ECS max-model-len)

defaults:
  concurrency: 1
  mean_output_tokens: 128
  stddev_input_tokens: 0
  stddev_output_tokens: 0
  max_num_completed_requests: 30
  timeout_s: 600

matrix:
  # 8192 deferred until all backends share a higher max context
  mean_input_tokens: [512, 1024, 2048, 4096]
